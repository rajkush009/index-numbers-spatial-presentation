<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Index Numbers | Spatial Presentation</title>
<style>
:root{
  --ink:#18192f; --cream:#f7ecdf; --sage:#a8b58e; --lav:#bda7d2; --peach:#efaa87;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:var(--cream);color:var(--ink)}
#viewport{
 position:fixed;inset:0;overflow:hidden;cursor:grab;
 background:
   radial-gradient(circle at 50% 48%, rgba(255,255,255,.86) 0 8%, transparent 34%),
   linear-gradient(135deg,#f1e7da 0%,#fbf5ec 48%,#e7dde4 100%);
 perspective:1100px;
 transform-style:preserve-3d;
}
#viewport:before{
 content:"";position:absolute;inset:-10%;
 pointer-events:none;
 background:
   radial-gradient(ellipse at 18% 18%,rgba(139,160,119,.55) 0 12%,transparent 30%),
   radial-gradient(ellipse at 83% 18%,rgba(165,137,188,.48) 0 11%,transparent 29%),
   radial-gradient(ellipse at 18% 86%,rgba(229,142,108,.48) 0 12%,transparent 30%),
   radial-gradient(ellipse at 86% 85%,rgba(145,165,121,.52) 0 13%,transparent 31%);
 filter:blur(22px);
 transform:translateZ(-120px) scale(1.12);
 opacity:.92;
}
#viewport:after{
 content:"";position:absolute;inset:0;pointer-events:none;
 background:
   linear-gradient(115deg,transparent 0 38%,rgba(255,255,255,.26) 48%,transparent 59%),
   radial-gradient(circle at 50% 50%,transparent 0 46%,rgba(35,35,60,.10) 100%);
 mix-blend-mode:soft-light;
}
#camera{
 position:absolute;left:0;top:0;width:1px;height:1px;
 transform-origin:0 0;will-change:transform;
 transform-style:preserve-3d;
}
#space{position:absolute;left:0;top:0;width:5600px;height:2300px;transform-style:preserve-3d}

/* Floating 3D environment layers */
.bg-depth{
 position:absolute;inset:-240px;
 pointer-events:none;transform-style:preserve-3d;
}
.depth-orb{
 position:absolute;border-radius:50%;
 filter:blur(1px);
 box-shadow:
   inset 18px 14px 35px rgba(255,255,255,.38),
   inset -22px -24px 42px rgba(30,30,50,.12),
   0 35px 70px rgba(25,25,50,.12);
 transform-style:preserve-3d;
 animation:orbFloat 9s ease-in-out infinite alternate;
}
.orb1{width:360px;height:360px;left:260px;top:110px;background:#aebc98;transform:translateZ(-120px)}
.orb2{width:270px;height:270px;right:410px;top:80px;background:#bca7cf;transform:translateZ(-40px);animation-delay:-2s}
.orb3{width:330px;height:330px;left:20px;bottom:70px;background:#e9a27f;transform:translateZ(40px);animation-delay:-4s}
.orb4{width:410px;height:410px;right:40px;bottom:40px;background:#aab992;transform:translateZ(-80px);animation-delay:-6s}

.depth-ring{
 position:absolute;border:28px solid rgba(255,255,255,.22);
 border-radius:50%;
 box-shadow:0 30px 80px rgba(30,30,55,.12), inset 0 0 35px rgba(30,30,55,.08);
 animation:ringFloat 11s ease-in-out infinite alternate;
}
.ring1{width:460px;height:460px;left:480px;top:720px;transform:translateZ(-70px) rotateX(64deg)}
.ring2{width:320px;height:320px;right:560px;top:570px;transform:translateZ(30px) rotateY(62deg);animation-delay:-5s}

.depth-panel{
 position:absolute;width:720px;height:380px;border-radius:55px;
 background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.06));
 border:1px solid rgba(255,255,255,.35);
 box-shadow:0 45px 90px rgba(25,25,50,.12);
 backdrop-filter:blur(2px);
}
.panel1{left:720px;top:190px;transform:translateZ(-150px) rotateZ(-5deg)}
.panel2{right:520px;bottom:220px;transform:translateZ(-100px) rotateZ(6deg)}

.depth-grid{
 position:absolute;left:-300px;right:-300px;bottom:-260px;height:680px;
 opacity:.20;
 background:
  linear-gradient(rgba(35,35,60,.20) 1px,transparent 1px),
  linear-gradient(90deg,rgba(35,35,60,.20) 1px,transparent 1px);
 background-size:90px 90px;
 transform:perspective(900px) rotateX(62deg) translateZ(-180px);
 transform-origin:center bottom;
 mask-image:linear-gradient(to top,black,transparent);
}
@keyframes orbFloat{
 from{margin-top:-10px}
 to{margin-top:18px}
}
@keyframes ringFloat{
 from{transform:translateZ(-70px) rotateX(64deg) rotateZ(-2deg)}
 to{transform:translateZ(-70px) rotateX(64deg) rotateZ(3deg) translateY(-18px)}
}
#camera{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0;will-change:transform}
#space{position:absolute;left:0;top:0;width:5600px;height:2300px}
.decor{position:absolute;border-radius:45%;filter:blur(.2px);opacity:.9;box-shadow:inset -25px -30px 50px rgba(0,0,0,.08),inset 20px 20px 45px rgba(255,255,255,.28)}
.d1{left:-130px;top:-120px;width:980px;height:470px;background:#a7b38a;transform:rotate(8deg)}
.d2{right:-180px;top:-100px;width:1050px;height:520px;background:#bca4d0;transform:rotate(-7deg)}
.d3{left:-180px;bottom:-170px;width:980px;height:500px;background:#efa983;transform:rotate(-8deg)}
.d4{right:-160px;bottom:-160px;width:1080px;height:520px;background:#a9b88e;transform:rotate(9deg)}
.ball{position:absolute;width:85px;height:85px;border-radius:50%;box-shadow:inset 15px 12px 20px rgba(255,255,255,.3),inset -12px -14px 22px rgba(0,0,0,.1)}
.ball.a{left:100px;top:110px;background:#ef9876} .ball.b{left:230px;top:190px;background:#b59fd0}
.ball.c{right:180px;top:95px;background:#a6b18a} .ball.d{right:80px;bottom:120px;background:#f0a780}
.gear{position:absolute;width:220px;height:220px;right:230px;bottom:190px;border-radius:30%;background:#9fac88;opacity:.75}
.gear:after{content:"";position:absolute;inset:45px;border-radius:50%;background:#f7ecdf;box-shadow:0 0 0 20px rgba(0,0,0,.04)}
.links{position:absolute;inset:0;z-index:2;overflow:visible;pointer-events:none}
.center{position:absolute;left:2480px;top:880px;width:560px;height:200px;border-radius:24px;background:rgba(255,255,255,.95);z-index:6;
 display:grid;place-items:center;text-align:center;font-size:48px;font-weight:850;box-shadow:0 28px 70px rgba(20,21,48,.16);border:1px solid rgba(255,255,255,.7);cursor:pointer}
.center small{display:block;font-size:15px;opacity:.55;margin-top:8px;font-weight:650}
.branch{position:absolute;z-index:7;border:0;background:var(--ink);color:white;border-radius:999px;padding:18px 34px;min-width:190px;
 box-shadow:0 18px 38px rgba(24,25,47,.2);font-size:25px;line-height:1.05;cursor:pointer;transition:transform .22s,box-shadow .22s}
.branch:hover{transform:scale(1.05);box-shadow:0 25px 50px rgba(24,25,47,.3)}
.branch span{display:block;font-weight:400} .branch b{display:block;font-weight:500}
.basics{left:3180px;top:390px} .methods{left:3180px;top:1110px}
.applications{left:620px;top:1180px} .review{left:620px;top:300px}
.page-card{position:absolute;width:330px;height:225px;padding:0;border:0;border-radius:10px;overflow:hidden;background:white;z-index:5;cursor:pointer;
 box-shadow:0 14px 28px rgba(20,21,47,.18);transform:rotate(-2deg);transition:transform .22s,box-shadow .22s}
.page-card:nth-of-type(2n){transform:rotate(2deg)}
.page-card.selected{transform:rotate(0deg)}
.page-card[data-go="0"]{transform:rotate(-3deg)}
.page-card[data-go="0"]:hover{transform:translateY(-8px) scale(1.08) rotate(0)} .page-card:hover{transform:translateY(-8px) scale(1.08) rotate(0);box-shadow:0 25px 45px rgba(20,21,47,.28);z-index:12}
.page-card img{width:100%;height:168px;display:block;object-fit:cover}
.page-number{position:absolute;left:7px;top:7px;background:var(--ink);color:#fff;border-radius:7px;padding:3px 6px;font-size:9px;font-weight:800}
.page-name{display:block;padding:8px 10px;font-size:11px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:7px;padding:8px;border-radius:16px;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);box-shadow:0 12px 35px rgba(0,0,0,.14)}
.hud button{border:0;background:var(--ink);color:white;border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:750}
.status{min-width:160px;text-align:center;font-size:12px;font-weight:800;padding:9px 2px}
.zoom{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:6px}
.zoom button{border:0;border-radius:10px;background:rgba(255,255,255,.85);padding:10px 14px;cursor:pointer;font-size:18px}
.brand{position:fixed;left:18px;bottom:18px;z-index:50;background:var(--ink);color:white;padding:9px 13px;border-radius:11px;font-size:12px;font-weight:800}
.hint{position:fixed;right:18px;bottom:18px;z-index:50;transition:opacity .25s ease,visibility .25s ease;background:rgba(255,255,255,.75);backdrop-filter:blur(12px);padding:10px 13px;border-radius:12px;font-size:11px}.focus-mode .hint{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.focus-mode .zoom{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
#viewer{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(12,13,35,.76);backdrop-filter:blur(10px);padding:4vh 4vw}
#viewer.open{display:grid}
.viewer-box{width:min(1000px,88vw);max-height:88vh;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 40px 110px rgba(0,0,0,.45);position:relative}
.viewer-box img{width:100%;max-height:72vh;object-fit:contain;display:block;background:#d8e9f0}
.vbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}
.vbar b{font-size:15px} .vbar span{font-size:12px;opacity:.6}
.vbar button,#close{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}
#close{position:absolute;right:12px;top:12px;border-radius:50%;width:38px;height:38px;font-size:19px;z-index:2}
@media(max-width:900px){.center{left:1320px;width:450px;font-size:38px}.branch{font-size:19px;min-width:150px}.hint{display:none}}

/* Destination focus: subtle light pulse around the selected card. */
@keyframes destinationPulse {
  0%,100% { box-shadow:0 14px 28px rgba(20,21,47,.18), 0 0 0 rgba(255,255,255,0); }
  50% { box-shadow:0 18px 35px rgba(20,21,47,.22), 0 0 28px rgba(255,255,255,.7); }
}
.page-card.focus-pulse { animation: destinationPulse 1.15s ease-in-out 1; }



/* v9: focus presentation is a fixed viewport layer.
   This prevents map-space transforms from cropping the actual slide. */
#focusStage{
  position:fixed;
  inset:0;
  z-index:70;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:76px 42px 78px;
  box-sizing:border-box;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .42s ease, visibility .42s ease;
  background:rgba(22,23,52,.06);
}
#focusStage.open{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
#focusStage .focus-frame{
  width:min(90vw, 1320px);
  aspect-ratio:16 / 9;
  max-height:calc(100vh - 154px);
  border-radius:28px;
  overflow:hidden;
  background:#fff;
  box-shadow:0 30px 90px rgba(20,21,47,.30);
  border:1px solid rgba(255,255,255,.72);
  transform:scale(.965);
  opacity:0;
  transition:transform .52s cubic-bezier(.2,.85,.25,1), opacity .38s ease;
}
#focusStage.open .focus-frame{
  transform:scale(1);
  opacity:1;
}
#focusStage.open .focus-frame{animation:focusCinematic .72s cubic-bezier(.18,.82,.24,1) both}
@keyframes focusCinematic{
  0%{transform:scale(.91);opacity:.25;filter:blur(2px)}
  58%{transform:scale(1.025);opacity:1;filter:blur(0)}
  100%{transform:scale(1);opacity:1;filter:blur(0)}
}
#focusStage img{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  background:#f5f5f5;
}
#focusStage .focus-caption{
  position:absolute;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  padding:10px 18px;
  border-radius:999px;
  background:rgba(22,23,52,.90);
  color:#fff;
  font-size:14px;
  font-weight:800;
  letter-spacing:.2px;
  box-shadow:0 12px 28px rgba(20,21,47,.22);
}

/* During focus, remove map clutter behind the fixed slide. */
#viewport.focused .page-card,
#viewport.focused .branch,
#viewport.focused .center,
#viewport.focused .links{
  opacity:0 !important;
  pointer-events:none !important;
}
#viewport.focused .hint{opacity:0;pointer-events:none}
#viewport.focused + .hint{opacity:0;pointer-events:none}
#viewport.focused .zoom{opacity:0;pointer-events:none}
#viewport.focused .decor,
#viewport.focused .ball,
#viewport.focused .gear{
  opacity:.08;
}


@media (prefers-reduced-motion: reduce){
  .depth-orb,.depth-ring{animation:none!important}
  #camera{transition:none!important}
}


/* v17 immersive 3D atmosphere */
#viewport{
  background:
    radial-gradient(circle at 50% 46%,rgba(255,255,255,.94) 0 7%,transparent 29%),
    radial-gradient(circle at 50% 120%,rgba(79,68,100,.10),transparent 45%),
    linear-gradient(135deg,#eee4d8 0%,#fbf7f0 44%,#e4dbe5 100%);
}
#viewport .atmo{position:absolute;inset:0;pointer-events:none;overflow:hidden;transform-style:preserve-3d}
.atmo .blob{position:absolute;border-radius:42%;filter:blur(3px);opacity:.48;mix-blend-mode:multiply;box-shadow:inset 30px 25px 70px rgba(255,255,255,.45),inset -35px -35px 75px rgba(35,25,55,.12),0 50px 100px rgba(30,25,50,.10);animation:blobDrift 16s ease-in-out infinite alternate}
.atmo .b1{width:760px;height:500px;left:-160px;top:90px;background:#a9b98e;transform:translateZ(-280px) rotate(-12deg)}
.atmo .b2{width:680px;height:440px;right:-110px;top:40px;background:#bca4d0;transform:translateZ(-170px) rotate(10deg);animation-delay:-5s}
.atmo .b3{width:650px;height:420px;left:-100px;bottom:-80px;background:#eda27e;transform:translateZ(-100px) rotate(14deg);animation-delay:-9s}
.atmo .b4{width:760px;height:470px;right:-160px;bottom:-100px;background:#a9ba91;transform:translateZ(-240px) rotate(-9deg);animation-delay:-12s}
.atmo .halo{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.35);box-shadow:0 0 80px rgba(255,255,255,.16),inset 0 0 55px rgba(255,255,255,.12);animation:haloPulse 10s ease-in-out infinite}
.atmo .h1{width:720px;height:720px;left:50%;top:42%;transform:translate(-50%,-50%) translateZ(-330px)}
.atmo .h2{width:1100px;height:620px;left:50%;top:50%;transform:translate(-50%,-50%) rotateX(68deg) translateZ(-390px);animation-delay:-4s}
.atmo .beam{position:absolute;width:35vw;height:120vh;top:-20vh;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);filter:blur(22px);opacity:.55;transform:rotate(18deg) translateZ(-250px);animation:beamMove 18s linear infinite}
.atmo .beam2{left:58%;animation-delay:-9s;transform:rotate(-22deg) translateZ(-300px)}
.atmo .dust{position:absolute;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.7);box-shadow:0 0 18px rgba(255,255,255,.65);animation:dustFloat 13s linear infinite}
.atmo .d1x{left:18%;top:35%;animation-delay:-2s}.atmo .d2x{left:74%;top:27%;animation-delay:-6s}.atmo .d3x{left:82%;top:67%;animation-delay:-9s}.atmo .d4x{left:31%;top:76%;animation-delay:-11s}
@keyframes blobDrift{from{margin-left:-15px;margin-top:8px}to{margin-left:30px;margin-top:-22px}}
@keyframes haloPulse{0%,100%{opacity:.22;scale:.94}50%{opacity:.55;scale:1.03}}
@keyframes beamMove{from{left:-35%;opacity:0}20%{opacity:.5}70%{opacity:.35}to{left:115%;opacity:0}}
@keyframes dustFloat{0%{transform:translate3d(0,50px,-50px);opacity:0}20%{opacity:.75}80%{opacity:.35}100%{transform:translate3d(80px,-140px,120px);opacity:0}}
@media (prefers-reduced-motion:reduce){.atmo *{animation:none!important}}



/* v20: cleaner Prezi-style connector system + cinematic opening */
.links{overflow:visible;pointer-events:none;opacity:.98;filter:drop-shadow(0 2px 2px rgba(15,18,45,.10))}
.links .main-link{fill:none;stroke:rgba(24,25,55,.94);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.links .main-link.secondary{stroke-width:5;opacity:.72}
.links .branch-link{fill:none;stroke:rgba(24,25,55,.88);stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}
.links{pointer-events:none}
.links .main-link{opacity:.92}
.links .branch-link{opacity:.84}
.links .branch-link:hover{stroke-width:7}
.links .main-link,.links .branch-link{stroke-dasharray:none;stroke-dashoffset:0}

/* Opening: establish the world first, then let the map settle into place. */
body.opening #space{animation:openingSpace 1.75s cubic-bezier(.18,.82,.24,1) both}
body.opening .links{opacity:.98}
body.opening .links path{stroke-dasharray:1;stroke-dashoffset:1;animation:drawConnector 1.15s cubic-bezier(.22,.78,.25,1) both}
body.opening .links path:nth-child(1){animation-delay:.78s}
body.opening .links path:nth-child(2){animation-delay:.84s}
body.opening .links path:nth-child(3){animation-delay:.90s}
body.opening .links path:nth-child(4){animation-delay:.96s}
body.opening .links path:nth-child(5){animation-delay:1.02s}
body.opening .links path:nth-child(n+6){animation-delay:1.08s}
body.opening .center{opacity:0;animation:openingCenter 1.0s cubic-bezier(.18,.82,.24,1) .65s both}
body.opening .branch{opacity:0;animation:openingNodes .85s cubic-bezier(.18,.82,.24,1) .85s both}
body.opening .page-card{opacity:0;animation:openingCards .95s cubic-bezier(.18,.82,.24,1) both}
body.opening .page-card:nth-child(1n){animation-delay:1.12s}
body.opening .page-card:nth-child(2n){animation-delay:1.20s}
body.opening .page-card:nth-child(3n){animation-delay:1.28s}
@keyframes openingSpace{0%{opacity:.12;filter:blur(5px)}45%{opacity:.72;filter:blur(1.5px)}100%{opacity:1;filter:blur(0)}}
@keyframes drawConnector{from{stroke-dashoffset:1;opacity:.15}to{stroke-dashoffset:0;opacity:1}}
@keyframes openingCenter{0%{opacity:0;transform:scale(.82) translateY(18px)}70%{opacity:1;transform:scale(1.035) translateY(-2px)}100%{opacity:1;transform:scale(1)}}
@keyframes openingNodes{0%{opacity:0;transform:scale(.65) translateY(15px)}75%{opacity:1;transform:scale(1.04) translateY(-2px)}100%{opacity:1;transform:scale(1)}}
@keyframes openingCards{0%{opacity:0;transform:translateY(35px) scale(.78) rotate(-1deg)}70%{opacity:1;transform:translateY(-4px) scale(1.035) rotate(0)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}

/* v18: reference-inspired sculptural 3D environment */
#viewport{
  background:
    radial-gradient(circle at 50% 48%, rgba(255,255,255,.92) 0 9%, transparent 36%),
    linear-gradient(135deg,#eee5d8 0%,#fbf3e8 47%,#e8dfe5 100%);
}

.atmo{
  position:absolute;
  inset:-12%;
  z-index:0;
  pointer-events:none;
  transform-style:preserve-3d;
  perspective:1500px;
  transition:transform .95s cubic-bezier(.18,.82,.24,1), filter .95s ease;
  will-change:transform;
}
#viewport.cinematic-pull .atmo{
  transform:scale(.86) translate3d(0,18px,-80px) rotateX(2deg);
  filter:saturate(.94) brightness(.98);
}
#viewport.cinematic-push .atmo{
  transform:scale(1.075) translate3d(0,-5px,45px) rotateX(-1deg);
  filter:saturate(1.05) brightness(1.015);
}

/* v27: real 3D mouse-tilt group. .atmo carries the camera-driven cinematic
   scale/depth; .atmo-tilt (its child) carries a separate, continuously
   smoothed rotateX/rotateY driven by the pointer, so the two never fight
   over the same transform. */
.atmo-tilt{
  position:absolute;inset:0;
  transform-style:preserve-3d;
  will-change:transform;
  transition:transform .05s linear;
}

.atmo .blob{
  position:absolute;
  border-radius:48% 52% 43% 57%;
  box-shadow:
    inset 22px 18px 34px rgba(255,255,255,.34),
    inset -28px -32px 52px rgba(40,35,55,.13),
    0 34px 90px rgba(35,30,55,.12);
  transform-style:preserve-3d;
  animation:sculptFloat 13s ease-in-out infinite alternate;
}
.atmo .b1{width:880px;height:500px;left:-190px;top:-120px;background:#a8b68e;transform:rotate(9deg) translateZ(-170px)}
.atmo .b2{width:880px;height:500px;right:-150px;top:-90px;background:#b9a3ca;transform:rotate(-8deg) translateZ(-90px);animation-delay:-3s}
.atmo .b3{width:720px;height:390px;left:-110px;bottom:-90px;background:#e8a27f;transform:rotate(-8deg) translateZ(20px);animation-delay:-6s}
.atmo .b4{width:820px;height:450px;right:-150px;bottom:-100px;background:#a8b58d;transform:rotate(8deg) translateZ(-120px);animation-delay:-9s}

/* soft 3D "pillars" and floating blocks */
.atmo .sculpt{
  position:absolute;
  border-radius:30px;
  box-shadow:
    inset 18px 16px 28px rgba(255,255,255,.28),
    inset -22px -26px 34px rgba(30,28,45,.14),
    0 28px 65px rgba(30,28,50,.13);
  transform-style:preserve-3d;
  animation:sculptFloat 11s ease-in-out infinite alternate;
}
.atmo .s1{width:135px;height:360px;right:300px;top:40px;background:#a9b58f;transform:rotate(2deg) translateZ(30px)}
.atmo .s2{width:150px;height:420px;right:455px;top:0;background:#b69fc8;transform:rotate(1deg) translateZ(-10px);animation-delay:-4s}

const pages = [

  {num:"10",group:"Laspeyres vs Paasche",title:"Laspeyres vs Paasche",src:"assets/page-10.png",x:5100,y:900},
  {num:"11",group:"Fisher",title:"Fisher's Ideal Index",src:"assets/page-11.png",x:5350,y:1640},
  {num:"12",group:"Fixed Base",title:"Fixed Base Index",src:"assets/page-12.png",x:700,y:1380},
  {num:"13",group:"Chain Index",title:"Chain Index",src:"assets/page-13.png",x:180,y:1780},
  {num:"14",group:"Group Index",title:"Group Index",src:"assets/page-14.png",x:1000,y:1900},

];
// Final spatial layout: intentionally wide, presentation-friendly spacing.
// v26: fixed reference-style spatial layout; connector geometry matches card/node edges.
const FINAL_POSITIONS = {0:[1450,650],1:[3450,250],2:[4050,110],3:[4700,380],4:[4250,700],5:[3500,1300],6:[3850,1640],7:[4300,980],8:[4700,1450],9:[5100,900],10:[5350,1640],11:[700,1380],12:[180,1780],13:[1000,1900],14:[1500,1720],15:[150,520],16:[650,820],17:[1350,180]};

pages.forEach((p) => {

/* v27: connectors are computed from real DOM geometry instead of hand-picked
   pixel coordinates. Every line starts/ends exactly on the border of its
   node/card, and lines sharing a source are angle-sorted so they fan out
   in visual order instead of crossing each other. */
const CONNECTOR_GROUPS = {
  basics:       [1, 2, 3, 4],
  methods:      [5, 6, 7, 8, 9, 10],
  applications: [11, 12, 13, 14],
  review:       [15, 16, 17]
};
const SVGNS = "http://www.w3.org/2000/svg";

function elBox(el){
  return {
    x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight,
    cx: el.offsetLeft + el.offsetWidth/2, cy: el.offsetTop + el.offsetHeight/2
  };
}

// Point where the straight line from box-center toward (tx,ty) crosses the box border.
function edgePoint(box, tx, ty){
  const dx = tx - box.cx, dy = ty - box.cy;
  if (!dx && !dy) return {x: box.cx, y: box.cy};
  const hw = box.w/2, hh = box.h/2;
  const sx = dx !== 0 ? hw/Math.abs(dx) : Infinity;
  const sy = dy !== 0 ? hh/Math.abs(dy) : Infinity;
  const s = Math.min(sx, sy);
  return {x: box.cx + dx*s, y: box.cy + dy*s};
}

// Smooth "elbow" bezier (à la d3 linkHorizontal): control points sit halfway
// between the two x-coordinates, so curves from a shared source naturally
// splay outward without looping over one another.
function linkPath(a, b){
  const midX = (a.x + b.x) / 2;
  return `M${a.x.toFixed(1)} ${a.y.toFixed(1)} C${midX.toFixed(1)} ${a.y.toFixed(1)} ${midX.toFixed(1)} ${b.y.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
}

function buildConnectors(){
  const svg = document.getElementById("linksSvg");
  if (!svg) return;
  svg.innerHTML = "";

  const centerEl = document.getElementById("center");
  const centerBox = elBox(centerEl);

  const branchEls = {
    basics: document.querySelector(".branch.basics"),
    methods: document.querySelector(".branch.methods"),
    applications: document.querySelector(".branch.applications"),
    review: document.querySelector(".branch.review")
  };

  const cardEls = {};
  document.querySelectorAll(".page-card").forEach(c => { cardEls[c.dataset.go] = c; });

  function addPath(a, b, cls){
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("pathLength", "1");
    p.setAttribute("class", cls);
    p.setAttribute("d", linkPath(a, b));
    svg.appendChild(p);
  }

  // Center -> title card (page 0), a soft secondary line.
  if (cardEls[0]) {
    const tBox = elBox(cardEls[0]);
    addPath(
      edgePoint(centerBox, tBox.cx, tBox.cy),
      edgePoint(tBox, centerBox.cx, centerBox.cy),
      "main-link secondary"
    );
  }

  // Center -> the four section nodes.
  Object.keys(branchEls).forEach(key => {
    const nb = elBox(branchEls[key]);
    addPath(
      edgePoint(centerBox, nb.cx, nb.cy),
      edgePoint(nb, centerBox.cx, centerBox.cy),
      "main-link"
    );
  });

  // Each section node -> its cards, angle-sorted so siblings fan out cleanly.
  Object.keys(CONNECTOR_GROUPS).forEach(key => {
    const nodeEl = branchEls[key];
    if (!nodeEl) return;
    const nb = elBox(nodeEl);
    const targets = CONNECTOR_GROUPS[key]
      .filter(i => cardEls[i])
      .map(i => ({box: elBox(cardEls[i])}));
    targets.sort((a, b) =>
      Math.atan2(a.box.cy - nb.cy, a.box.cx - nb.cx) -
      Math.atan2(b.box.cy - nb.cy, b.box.cx - nb.cx)
    );
    targets.forEach(t => {
      addPath(
        edgePoint(nb, t.box.cx, t.box.cy),
        edgePoint(t.box, nb.cx, nb.cy),
        "branch-link"
      );
    });
  });
}

const camera = document.getElementById("camera");
const viewport = document.getElementById("viewport");
const status = document.getElementById("status");
const viewer = document.getElementById("viewer");
const viewImg = document.getElementById("viewImg");
const viewTitle = document.getElementById("viewTitle");
const focusStage = document.getElementById("focusStage");
const focusImg = document.getElementById("focusImg");
const focusCaption = document.getElementById("focusCaption");

const viewSub = document.getElementById("viewSub");

let idx = -1;
let camX = 0, camY = 0, scale = 0.44;
let raf = null;
let isDragging = false;
let dragStart = {x:0,y:0};
let cameraStart = {x:0,y:0};

function easeInOut(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
}

function applyCamera() {
  camera.style.transform =
    `translate3d(${camX}px,${camY}px,0) scale(${scale})`;
  applyParallax();
}

/* v27: single source of truth for the .bg-depth transform. Camera panning
   (applyParallax) and pointer tilt (tiltLoop) each write their own offset
   into `depthState` and call renderDepth() — they never overwrite each
   other's numbers, which is what made the old mouse animation feel broken. */
const depthState = {camX:0, camY:0, camRZ:0, mouseX:0, mouseY:0, mouseRZ:0};

function renderDepth(){
  const layer = document.querySelector(".bg-depth");
  if(!layer) return;
  const tx = depthState.camX + depthState.mouseX;
  const ty = depthState.camY + depthState.mouseY;
  const rz = depthState.camRZ + depthState.mouseRZ;
  layer.style.transform = `translate3d(${tx}px,${ty}px,0) rotateZ(${rz}deg)`;
}

function applyParallax(){
  depthState.camX = Math.max(-55, Math.min(55, camX * -0.018));
  depthState.camY = Math.max(-40, Math.min(40, camY * -0.014));
  depthState.camRZ = Math.max(-2.2, Math.min(2.2, camX * 0.00045));
  renderDepth();
}

function animateCamera(target, duration=1450, path="direct", onComplete=null) {
  if (raf) cancelAnimationFrame(raf);

  const from = {x:camX, y:camY, s:scale};
  const started = performance.now();

  function tick(now) {
    const raw = Math.min(1, (now-started)/duration);
    const t = easeInOut(raw);
    const dx = target.x - from.x;
    const dy = target.y - from.y;

    if (path === "cinematic") {
      // Classic Prezi-style pull-back, travel, push-in.
      if (raw < 0.38) {
        const q = easeInOut(raw/0.38);
        camX = from.x + dx*0.16*q;
        camY = from.y + dy*0.16*q;
        scale = from.s + (Math.max(.36, from.s*.82)-from.s)*q;
      } else {
        const q = easeInOut((raw-.38)/.62);
        const sx = from.x + dx*.16;
        const sy = from.y + dy*.16;
        const ss = Math.max(.36, from.s*.82);
        const overshoot = Math.sin(q*Math.PI) * .014;
        camX = sx + (target.x-sx)*q;
        camY = sy + (target.y-sy)*q;
        scale = ss + (target.s-ss)*(q+overshoot);
      }
    } else if (path === "pan") {
      // Mostly lateral travel. Keeps the camera close to the map.
      const e = easeInOut(raw);
      const bow = Math.sin(raw*Math.PI) * Math.min(85, Math.hypot(dx,dy)*.035);
      const nx = -dy / Math.max(1, Math.hypot(dx,dy));
      const ny = dx / Math.max(1, Math.hypot(dx,dy));
      camX = from.x + dx*e + nx*bow;
      camY = from.y + dy*e + ny*bow;
      scale = from.s + (target.s-from.s)*(e*.78);
    } else if (path === "depth") {
      // Dive toward the next node, then recover into the destination.
      let e;
      if (raw < .55) e = easeInOut(raw/.55);
      else e = easeInOut((raw-.55)/.45);
      const midX = from.x + dx*.52;
      const midY = from.y + dy*.52;
      if (raw < .55) {
        camX = from.x + (midX-from.x)*e;
        camY = from.y + (midY-from.y)*e;
        scale = from.s + (Math.max(.30, from.s*.64)-from.s)*e;
      } else {
        const q = e;
        const overshoot = Math.sin(q*Math.PI)*.018;
        camX = midX + (target.x-midX)*q;
        camY = midY + (target.y-midY)*q;
        scale = Math.max(.30, from.s*.64) + (target.s-Math.max(.30, from.s*.64))*(q+overshoot);
      }
    } else if (path === "orbit") {
      // Curved movement around the destination. More expressive, still controlled.
      const e = easeInOut(raw);
      const dist = Math.hypot(dx,dy);
      const nx = -dy / Math.max(1,dist);
      const ny = dx / Math.max(1,dist);
      const arc = Math.sin(raw*Math.PI) * Math.min(150, dist*.075);
      camX = from.x + dx*e + nx*arc;
      camY = from.y + dy*e + ny*arc;
      scale = from.s + (target.s-from.s)*e + Math.sin(raw*Math.PI)*.045;
    } else if (path === "snap") {
      // Quick movement with a soft brake at the end.
      const e = 1 - Math.pow(1-raw, 4);
      camX = from.x + dx*e;
      camY = from.y + dy*e;
      scale = from.s + (target.s-from.s)*e;
    } else if (path === "wide") {
      // Briefly widen the map before revealing the destination.
      if (raw < .48) {
        const q = easeInOut(raw/.48);
        camX = from.x + dx*.12*q;
        camY = from.y + dy*.12*q;
        scale = from.s + (Math.max(.28, from.s*.72)-from.s)*q;
      } else {
        const q = easeInOut((raw-.48)/.52);
        const sx=from.x+dx*.12, sy=from.y+dy*.12, ss=Math.max(.28,from.s*.72);
        camX=sx+(target.x-sx)*q;
        camY=sy+(target.y-sy)*q;
        scale=ss+(target.s-ss)*q;
      }
    } else {
      camX = from.x + dx*t;
      camY = from.y + dy*t;
      scale = from.s + (target.s-from.s)*t;
    }

    applyCamera();

    if (raw < 1) {
      raf = requestAnimationFrame(tick);
    } else {
      camX = target.x;
      camY = target.y;
      scale = target.s;
      applyCamera();
      raf = null;
      if (typeof onComplete === "function") onComplete();
    }
  }

  raf = requestAnimationFrame(tick);
}

function overviewTarget() {
  const w = innerWidth, h = innerHeight;
  const s = Math.max(0.22, Math.min(0.31, Math.min(w/5350, h/2200)));
  return {
    x: w/2 - 2800*s,
    y: h/2 - 1150*s,
    s
  };
}

function frameTarget(i) {
  const p = pages[i];
  const w = innerWidth;
  const h = innerHeight;

  /*
    This target is ONLY for the camera journey through the spatial map.
    The final presentation slide is rendered in #focusStage, so the map
    camera never needs to solve the 16:9 slide fitting problem.
  */
  const mapCardW = 300;
  const mapCardH = 190;

  const targetScale = Math.max(
    1.55,
    Math.min(2.55, Math.min(w/820, h/570))
  );

  return {
    x: w/2 - (p.x + mapCardW/2) * targetScale,
    y: h/2 - (p.y + mapCardH/2) * targetScale,
    s: targetScale
  };
}

function branchTarget(type) {
  const w = innerWidth, h = innerHeight;
  const targets = {
    basics: [3175,470],
    methods: [3175,1180],
    applications: [815,1220],
    review: [815,340]
  };
  const [x,y] = targets[type] || targets.basics;
  const ss = Math.max(0.62, Math.min(0.92, Math.min(w/1150,h/760)));
  return {x:w/2-x*ss, y:h/2-y*ss, s:ss};
}


function openFocusStage(i) {
  const p = pages[i];
  if (!p) return;
  focusImg.src = p.src;
  focusImg.alt = p.title;
  focusCaption.textContent = `${p.num} · ${p.title}`;
  document.body.classList.add("focus-mode");
  focusStage.classList.add("open");
  focusStage.setAttribute("aria-hidden","false");
}

function closeFocusStage() {
  document.body.classList.remove("focus-mode");
  focusStage.classList.remove("open");
  focusStage.setAttribute("aria-hidden","true");
}

function highlight(i) {
  document.querySelectorAll(".page-card").forEach(el => {
    el.style.filter = "";
    el.style.transform = "";
    el.classList.remove("focus-pulse", "selected", "active");
  });

  const card = document.querySelector(`[data-go="${i}"]`);
  if (card) {
    card.classList.add("selected", "focus-pulse", "active");
    card.style.filter = "drop-shadow(0 0 14px rgba(255,255,255,.75))";
    card.style.transform = "scale(1.06) rotate(0deg)";
  }
}

function transitionStyle(fromIndex, toIndex){
  // Deliberately varied, but tied to the presentation's structure.
  // 0 = cinematic, 1 = pan, 2 = depth, 3 = orbit, 4 = snap, 5 = wide.
  if (fromIndex < 0) return "wide";
  const destination = toIndex;
  if ([1, 7, 14, 17].includes(destination)) return "cinematic"; // section / anchor reveals
  if ([2, 3, 5, 8, 9, 10].includes(destination)) return "pan"; // related concepts
  if ([4, 6, 11, 15].includes(destination)) return "orbit";
  if ([12, 16].includes(destination)) return "depth";
  if ([13, 18].includes(destination)) return "snap";
  return (fromIndex % 2 === 0) ? "depth" : "pan";
}

function cinematicBeatStart(path){
  viewport.classList.remove("cinematic-pull","cinematic-push","camera-pan","camera-depth","camera-orbit","camera-snap","camera-wide");
  viewport.classList.add(`camera-${path}`);
  clearTimeout(window.__cinematicBeat);

  if (path === "cinematic" || path === "wide" || path === "depth") {
    viewport.classList.add("cinematic-pull");
    window.__cinematicBeat = setTimeout(() => {
      viewport.classList.remove("cinematic-pull");
      viewport.classList.add("cinematic-push");
      setTimeout(() => viewport.classList.remove("cinematic-push"), 850);
    }, path === "depth" ? 330 : 420);
  }
}

function go(i) {
  const previous = idx;
  idx = (i + pages.length) % pages.length;
  const p = pages[idx];

  closeFocusStage();
  viewport.classList.remove("focused");
  status.textContent = `${p.num} · ${p.title}`;
  highlight(idx);

  const path = transitionStyle(previous, idx);
  const durations = {cinematic:1550, pan:1080, depth:1280, orbit:1220, snap:820, wide:1450};
  cinematicBeatStart(path);

  animateCamera(frameTarget(idx), durations[path] || 1200, path, () => {
    viewport.classList.add("focused");
    openFocusStage(idx);
  });
}

function showOverview() {
  idx = -1;
  closeFocusStage();
  viewport.classList.remove("focused");
  status.textContent = "OVERVIEW";

  document.querySelectorAll(".page-card").forEach(el => {
    el.style.filter = "";
    el.style.transform = "";
    el.classList.remove("focus-pulse", "selected", "active");
  });

  animateCamera(overviewTarget(), 1200);
}

function next() {
  // After the last slide, return to the spatial home/overview first.
  // The following Next action then starts the presentation again from slide 01.
  if (idx === pages.length - 1) {
    showOverview();
    return;
  }
  go(idx < 0 ? 0 : idx+1);
}
function previous() { go(idx <= 0 ? pages.length-1 : idx-1); }

function openViewer(i) {
  const p = pages[i];
  viewImg.src = p.src;
  viewTitle.textContent = `${p.num} · ${p.title}`;
  viewSub.textContent = p.group;
  viewer.classList.add("open");
}

function closeViewer() {
  viewer.classList.remove("open");
}

document.getElementById("center").onclick = showOverview;
document.getElementById("home").onclick = showOverview;
document.getElementById("next").onclick = next;
document.getElementById("prev").onclick = previous;

document.getElementById("zin").onclick = () => {
  scale = Math.min(7, scale * 1.18);
  applyCamera();
};
document.getElementById("zout").onclick = () => {
  scale = Math.max(0.03, scale / 1.18);
  applyCamera();
};

document.querySelectorAll(".page-card").forEach(card => {
  card.addEventListener("click", e => {
    e.stopPropagation();
    go(Number(card.dataset.go));
  });

  // Double click opens the actual full-size page.
  card.addEventListener("dblclick", e => {
    e.stopPropagation();
    openViewer(Number(card.dataset.go));
  });
});

document.querySelectorAll(".branch").forEach(branch => {
  branch.addEventListener("click", e => {
    e.stopPropagation();
    const n = Number(branch.dataset.focus);
    go(n);
  });
});

document.getElementById("close").onclick = closeViewer;
document.getElementById("vnext").onclick = () => openViewer((idx+1+pages.length)%pages.length);
document.getElementById("vprev").onclick = () => openViewer((idx-1+pages.length)%pages.length);
document.getElementById("pages").onclick = () => openViewer(idx < 0 ? 0 : idx);

/* Keyboard controls */
document.addEventListener("keydown", e => {
  if (viewer.classList.contains("open")) {
    if (e.key === "Escape") closeViewer();
    else if (e.key === "ArrowRight") document.getElementById("vnext").click();
    else if (e.key === "ArrowLeft") document.getElementById("vprev").click();
    return;
  }

  if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
    e.preventDefault();
    next();
  } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
    e.preventDefault();
    previous();
  } else if (e.key === "Home" || e.key === "Escape") {
    e.preventDefault();
    showOverview();
  } else if (e.key === "+" || e.key === "=") {
    scale = Math.min(7, scale*1.12);
    applyCamera();
  } else if (e.key === "-" || e.key === "_") {
    scale = Math.max(.03, scale/1.12);
    applyCamera();
  }
});

/* Mouse / touch drag */
viewport.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;
  isDragging = true;
  viewport.setPointerCapture(e.pointerId);
  dragStart = {x:e.clientX, y:e.clientY};
  cameraStart = {x:camX, y:camY};
  viewport.style.cursor = "grabbing";
});

viewport.addEventListener("pointermove", e => {
  if (!isDragging) return;
  camX = cameraStart.x + (e.clientX-dragStart.x);
  camY = cameraStart.y + (e.clientY-dragStart.y);
  applyCamera();
});

viewport.addEventListener("pointerup", () => {
  isDragging = false;
  viewport.style.cursor = "grab";
});

viewport.addEventListener("pointercancel", () => {
  isDragging = false;
  viewport.style.cursor = "grab";
});

/* Wheel zoom around the mouse pointer */
viewport.addEventListener("wheel", e => {
  e.preventDefault();

  const oldScale = scale;
  const factor = e.deltaY < 0 ? 1.09 : 0.917;
  const newScale = Math.max(.03, Math.min(7, oldScale*factor));

  const rect = viewport.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  // Keep the point below the cursor stable while zooming.
  camX = mx - (mx-camX) * (newScale/oldScale);
  camY = my - (my-camY) * (newScale/oldScale);
  scale = newScale;

  applyCamera();
}, {passive:false});

/* v27: real 3D mouse tilt, decoupled from the pointermove event rate.
   Raw pointer position only sets a *target*; a continuous requestAnimationFrame
   loop eases the current tilt toward that target every frame, so motion stays
   buttery smooth even on choppy trackpads/mice and never snaps. */
const tiltTarget = {x:0, y:0};
const tiltCurrent = {x:0, y:0};

viewport.addEventListener("pointermove", e => {
  if (isDragging) return;
  const r = viewport.getBoundingClientRect();
  tiltTarget.x = ((e.clientX-r.left)/r.width - .5);
  tiltTarget.y = ((e.clientY-r.top)/r.height - .5);
});
viewport.addEventListener("pointerleave", () => {
  tiltTarget.x = 0; tiltTarget.y = 0;
});

function tiltLoop(){
  tiltCurrent.x += (tiltTarget.x - tiltCurrent.x) * 0.07;
  tiltCurrent.y += (tiltTarget.y - tiltCurrent.y) * 0.07;

  // Ambient depth layer: gentle drift + rotation, blended with camera parallax.
  depthState.mouseX = tiltCurrent.x * -34;
  depthState.mouseY = tiltCurrent.y * -24;
  depthState.mouseRZ = tiltCurrent.x * 0.9;
  renderDepth();

  // Atmosphere group: genuine 3D rotation in space (this is the "3D background").
  const atmoTilt = document.querySelector(".atmo-tilt");
  if (atmoTilt) {
    const rx = tiltCurrent.y * -7;
    const ry = tiltCurrent.x * 9;
    const tz = (Math.abs(tiltCurrent.x) + Math.abs(tiltCurrent.y)) * 35;
    atmoTilt.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(${tz}px)`;
  }

  requestAnimationFrame(tiltLoop);
}
requestAnimationFrame(tiltLoop);

window.addEventListener("resize", () => {
  if (idx < 0) animateCamera(overviewTarget(), 500);
  else if (!focusStage.classList.contains("open")) animateCamera(frameTarget(idx), 700, "cinematic");
});

/* v27: gentle 3D tilt on cards themselves as the pointer moves over them —
   combined with the existing lift/scale hover style for a tactile feel. */
document.querySelectorAll(".page-card").forEach(card => {
  card.addEventListener("pointermove", e => {
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - .5;
    const py = (e.clientY - r.top) / r.height - .5;
    card.style.transform =
      `translateY(-8px) scale(1.08) perspective(700px) rotateX(${(py*-9).toFixed(2)}deg) rotateY(${(px*11).toFixed(2)}deg)`;
  });
  card.addEventListener("pointerleave", () => {
    if (!card.classList.contains("selected")) card.style.transform = "";
  });
});

/* Start on the full reference-style map. */
window.addEventListener("load", () => {
  buildConnectors();
  document.body.classList.add("opening");
  camX = 0; camY = 0; scale = .105;
  applyCamera();
  setTimeout(() => {
    animateCamera(overviewTarget(), 1850, "wide", () => {
      setTimeout(() => document.body.classList.remove("opening"), 350);
    });
  }, 90);
});

window.addEventListener("resize", () => buildConnectors());
</script>
</body>
</html>
